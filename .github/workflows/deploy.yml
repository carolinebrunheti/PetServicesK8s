# CD: todo push na main que mexa nos manifests (inclusive o commit automatico
# que as APIs fazem trocando a versao da imagem) e aplicado no AKS.
name: Deploy no AKS

# DESATIVADO em 2026-11-15: o cluster aks-petservices e o ACR foram apagados da
# Azure (fim da assinatura de testes). Para reativar, recrie a infraestrutura
# (README), rode o configurar-github-oidc.sh, devolva o gatilho de push abaixo e
# tire o "if: false" do job deploy.
on:
  # push:
  #   branches: [main]
  #   paths: ["base/**", "aks/**"]
  workflow_dispatch:   # botao "Run workflow" para aplicar na mao

# dois deploys nunca rodam ao mesmo tempo; o segundo espera o primeiro
concurrency:
  group: deploy-aks
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # token OIDC para o login na Azure

jobs:
  deploy:
    if: false   # desativado: nao ha mais cluster (ver o comentario no topo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Acesso ao cluster
        run: az aks get-credentials -g rg-petservices -n aks-petservices

      - name: Aplicar manifests
        run: kubectl apply -k aks

      # Espera cada app ficar pronto (o pod antigo continua no ar ate o novo
      # passar na readiness probe). Se o rollout de um app falhar, faz o
      # rollback SO desse app (um undo nos outros voltaria a versao anterior
      # deles, que esta saudavel) e falha o workflow para avisar.
      # O rollback nao corrige o git: o kustomization continua com a tag ruim,
      # e o proximo deploy a aplicaria de novo. Corrija com git revert.
      - name: Esperar o rolling update (com rollback automatico)
        run: |
          falharam=""
          for app in petservices agendamento historico; do
            if ! kubectl rollout status deploy/$app -n petservices --timeout=5m; then
              echo "::error::Rollout de $app falhou. Fazendo rollback para a versao anterior."
              kubectl rollout undo deploy/$app -n petservices
              kubectl rollout status deploy/$app -n petservices --timeout=5m || true
              echo "$app agora roda: $(kubectl get deploy/$app -n petservices -o jsonpath='{.spec.template.spec.containers[0].image}')"
              falharam="$falharam $app"
            fi
          done
          if [ -n "$falharam" ]; then
            echo "::error::Rollback feito em:$falharam. O git ainda tem a versao ruim: faca git revert do commit."
            exit 1
          fi
