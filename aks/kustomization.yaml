# versao para o AKS: reaproveita todos os manifests de base/ e so troca
# o nome das imagens para as do ACR. Aplicar com: kubectl apply -k aks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - gateway.yaml
  - letsencrypt.yaml
images:
  - name: petservices
    newName: acrpetservicesf3c82b.azurecr.io/petservices
    newTag: "9153681"
  - name: agendamento
    newName: acrpetservicesf3c82b.azurecr.io/agendamento
    newTag: "6ff673a"
  - name: historico
    newName: acrpetservicesf3c82b.azurecr.io/historico
    newTag: "2e875ec"
