# Regras de rede entre pods (o Calico do cluster aplica). Sem nenhuma regra,
# todo pod fala com todo pod. Aqui cada namespace comeca bloqueando toda entrada
# e libera so o necessario:
#
#   internet ──► gateway ──► APIs ──► postgres / kafka
#
# A saida (egress) continua livre. Probes do kubelet vem do proprio no e o
# Calico sempre permite.

# ---------- namespace infra ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bloquear-entrada
  namespace: infra
spec:
  podSelector: {}          # todos os pods do namespace
  policyTypes: [Ingress]   # sem regras de ingress = nada entra
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-so-das-apis
  namespace: infra
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: petservices
          podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [petservices, agendamento, historico] }
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-so-das-apis
  namespace: infra
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: petservices
          podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [petservices, agendamento, historico] }
        # o broker tambem se conecta no proprio endereco anunciado
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
---
# ---------- namespace petservices ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bloquear-entrada
  namespace: petservices
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# o proxy do Gateway recebe da internet (portas do Service LoadBalancer)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-da-internet
  namespace: petservices
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: petservices
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 80
        - port: 443
---
# as APIs so recebem do proxy do Gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apis-so-do-gateway
  namespace: petservices
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [petservices, agendamento, historico] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: petservices
      ports:
        - port: 8081
        - port: 8082
        - port: 8084
---
# renovacao do HTTPS: o Let's Encrypt chega pelo Gateway e o Gateway repassa
# para um pod temporario do cert-manager (acmesolver) criado neste namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: desafio-lets-encrypt
  namespace: petservices
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: petservices
      ports:
        - port: 8089
