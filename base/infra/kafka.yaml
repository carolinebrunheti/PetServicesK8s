# Kafka com 1 broker em modo KRaft (sem Zookeeper), a mesma imagem do docker-compose.
# So e alcancavel de dentro do cluster: nao existe porta publicada para fora.

# Service headless: cada pod ganha um nome fixo (kafka-0.kafka.infra.svc.cluster.local)
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: infra
spec:
  clusterIP: None
  # o broker precisa achar o proprio nome no DNS antes de ficar "pronto"
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: infra
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # sem isso o Kubernetes injeta variaveis como KAFKA_PORT=tcp://..., e a imagem
      # do Kafka transforma toda variavel KAFKA_* em configuracao, quebrando o broker
      enableServiceLinks: false
      securityContext:
        # a imagem roda com o usuario 1000; o disco precisa ser gravavel por ele
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.3.0
          ports:
            - name: kafka
              containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka.infra.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            # subpasta pelo mesmo motivo do Postgres (lost+found na raiz do disco)
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/logs
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 60
            periodSeconds: 15
          volumeMounts:
            - name: dados
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
